<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Creative Webpage</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav-menu" aria-label="Main navigation">
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main id="home" class="page-shell">
    <section class="hero">
      <div class="hero-content">
        <p class="eyebrow">Fresh Ideas</p>
        <h1>Build Beautiful Web Experiences</h1>
        <p class="intro">
          This simple webpage combines a clean navigation menu, a friendly
          heading, a short paragraph, an image, and a basic form using HTML and
          CSS.
        </p>

        <form class="signup-form" action="#" method="post">
          <label for="email">Join our updates</label>
          <div class="form-row">
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
            <button type="submit">Submit</button>
          </div>
        </form>
      </div>

      <div class="image-panel" aria-label="Workspace image">
        <img
          src="https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=900&q=80"
          alt="Modern workspace with plants and natural light">
      </div>
    </section>
  </main>
</body>
</html>
